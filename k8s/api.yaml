apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-sentinel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-sentinel-api
  template:
    metadata:
      labels:
        app: fraud-sentinel-api
    spec:
      containers:
        - name: api
          image: fraud-sentinel-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-sentinel-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: fraud-sentinel-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080